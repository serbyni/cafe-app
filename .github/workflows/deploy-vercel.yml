name: Deploy to Vercel

# Called by ci.yml after all checks pass (or run manually):
#   develop → Vercel project of the DEVELOPMENT environment (cafés at *.dev.serbi.me)
#   main    → production (added when production goes live)
# The café domain (e.g. *.dev.serbi.me) is a domain of the Vercel project, so every
# production deployment of that project serves it — no per-café alias or DNS step.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-vercel-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy (development)
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://${{ vars.CAFE_ROOT_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Cafés: https://<slug>.${{ vars.CAFE_ROOT_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"
