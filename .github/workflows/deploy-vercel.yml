name: Deploy to Vercel

# Called by ci.yml after all checks pass (or run manually):
#   target "production" — develop → Vercel project of the DEVELOPMENT environment (cafés at
#                         *.dev.serbi.me); main → production (added when production goes live).
#                         The café domain is a domain of the Vercel project, so every production
#                         deployment of that project serves it — no per-café alias or DNS step.
#   target "preview"    — a pull request (each new commit) → a Vercel preview deployment; its
#                         link is posted on the pull request. Open a café with ?cafe=<slug>.
on:
  workflow_call:
    inputs:
      target:
        type: string
        default: production
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [production, preview]
        default: production

concurrency:
  # One deployment at a time per branch; a newer commit on a PR replaces its pending preview.
  group: deploy-vercel-${{ inputs.target }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ inputs.target == 'preview' }}

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy (${{ inputs.target == 'preview' && 'preview' || 'development' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ inputs.target == 'preview' && 'preview' || 'development' }}
      url: ${{ inputs.target == 'preview' && steps.deploy.outputs.url || format('https://{0}', vars.CAFE_ROOT_DOMAIN) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ── Development (push to develop) ──
      - name: Pull Vercel settings (production)
        if: ${{ inputs.target != 'preview' }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (production)
        if: ${{ inputs.target != 'preview' }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # ── Preview (pull request) ──
      - name: Pull Vercel settings (preview)
        if: ${{ inputs.target == 'preview' }}
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (preview)
        if: ${{ inputs.target == 'preview' }}
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ inputs.target }}" = "preview" ]; then
            url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
            echo "Preview: $url — open a café with $url/?cafe=<slug>" >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
            echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
            echo "Cafés: https://<slug>.${{ vars.CAFE_ROOT_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Post the preview link on the pull request
        if: ${{ inputs.target == 'preview' && github.event.pull_request.number }}
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- vercel-preview -->";
            const url = process.env.URL;
            const body = `${marker}\n🔍 **Preview** (commit ${context.sha.slice(0, 7)}): ${url}\n\nOpen a café: \`${url}/?cafe=<slug>\` (e.g. ${url}/?cafe=test-place). Updated on every new commit of this pull request.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
